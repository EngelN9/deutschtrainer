services:
  deterministic:
    build:
      context: .
      args:
        DT_SOURCE_COMMIT: ${DT_SOURCE_COMMIT:?Set an exact committed DeutschTrainer revision}
        DT_SOURCE_CLEAN: ${DT_SOURCE_CLEAN:-false}
    command: ["validate"]
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 2g
    cpus: 1.0
    tmpfs:
      - /tmp:size=64m
      - /home/evaluator/.cache:size=128m
    volumes:
      - ./.runs:/runs

  live:
    profiles: ["live"]
    build:
      context: .
      args:
        DT_SOURCE_COMMIT: ${DT_SOURCE_COMMIT:?Set an exact committed DeutschTrainer revision}
        DT_SOURCE_CLEAN: ${DT_SOURCE_CLEAN:-false}
    read_only: true
    init: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 4g
    cpus: 2.0
    tmpfs:
      - /tmp:size=128m
      - /home/evaluator/.cache:size=256m
    environment:
      MATRAIX_EVAL_OPENAI_API_KEY: ${MATRAIX_EVAL_OPENAI_API_KEY:-}
      MATRAIX_EVAL_ANTHROPIC_API_KEY: ${MATRAIX_EVAL_ANTHROPIC_API_KEY:-}
    volumes:
      - ./.runs:/runs
      - ./.runs/materialized:/opt/matraix/application/tasks/deutschtrainer-runs:ro
      - ./.runs/materialized:/opt/matraix/persona/datasets/deutschtrainer-runs:ro
