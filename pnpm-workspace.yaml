packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
  sharp: true
# Expo SDK packages declare overlapping patch ranges (for example, expo@57.0.15
# declares expo-file-system ~57.0.5 and expo-linking@57.0.10 declares
# expo-constants ~57.0.18). Pin one compatible patch version for each aligned
# package so direct and transitive declarations dedupe for Expo Doctor.
overrides:
  expo-audio: 57.0.5
  expo-constants: 57.0.18
  expo-file-system: 57.0.7
  expo-linking: 57.0.10
