name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build API
        run: pnpm --filter @deutschtrainer/api build
      - name: Smoke API production bundle
        run: pnpm --filter @deutschtrainer/api verify:bundle
      - name: Build API container
        run: docker build --file apps/api/Dockerfile --tag deutschtrainer-api:ci .
      # Reported, not enforced. This compares against the versions Expo has published right
      # now, so it starts failing whenever the SDK ships patches, with no change to this repo:
      # ten packages were aligned on 2026-08-23 and seven were already behind a day later,
      # blocking a pull request that only edited render.yaml. The signal that actually matters
      # — whether the app still builds — is covered by Expo Doctor and the export steps below.
      - name: Expo dependency compatibility
        working-directory: apps/mobile
        run: pnpm exec expo install --check
        continue-on-error: true
      - name: Expo Doctor
        working-directory: apps/mobile
        run: pnpm dlx expo-doctor@1.20.1
      - name: Export Mobile Android
        run: pnpm --filter @deutschtrainer/mobile export:android
      - name: Export Mobile Web
        run: pnpm --filter @deutschtrainer/mobile export:web
      - name: Build Admin
        run: pnpm --filter @deutschtrainer/admin build
