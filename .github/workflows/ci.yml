name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Manual escape hatch. On 2026-09-02 event-triggered runs silently stopped being created across
  # the account: no failed run, none at all, while the Actions API, the workflow state and the
  # trigger config all looked healthy. That is not a hypothetical outage — every Render service
  # uses autoDeployTrigger: checksPass, so zero checks also means zero deploys, and a merge appears
  # to succeed while changing nothing live. GitHub only offers this trigger when it is present on
  # the default branch, so it has to live here to be worth anything.
  workflow_dispatch:

jobs:
  matraix-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.12.3
          enable-cache: true
      - name: Sync deterministic evaluation environment
        working-directory: evaluation/matraix
        run: uv sync --frozen --no-extra live
      - name: Ruff
        working-directory: evaluation/matraix
        run: uv run --frozen ruff check .
      - name: Python tests
        working-directory: evaluation/matraix
        run: uv run --frozen pytest -q
      - name: Validate frozen matrix
        working-directory: evaluation/matraix
        run: uv run --frozen dt-matraix validate
      - name: Verify production WritingFeedback contract
        run: pnpm --filter @deutschtrainer/api exec tsx ../../evaluation/matraix/scripts/verify-writing-fixtures.ts
      - name: Plan deterministic run
        working-directory: evaluation/matraix
        run: uv run --frozen dt-matraix plan --run-id ci-preflight
      - name: Materialize survey tasks
        working-directory: evaluation/matraix
        run: uv run --frozen dt-matraix materialize --run-id ci-preflight
      - name: Verify production isolation
        working-directory: evaluation/matraix
        run: uv run --frozen dt-matraix verify-isolation

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build API
        run: pnpm --filter @deutschtrainer/api build
      - name: Smoke API production bundle
        run: pnpm --filter @deutschtrainer/api verify:bundle
      - name: Build API container
        run: docker build --file apps/api/Dockerfile --tag deutschtrainer-api:ci .
      - name: Export Mobile Android
        run: pnpm --filter @deutschtrainer/mobile export:android
      - name: Export Mobile Web
        run: pnpm --filter @deutschtrainer/mobile export:web
      - name: Build Admin
        run: pnpm --filter @deutschtrainer/admin build
      # These two reach out to Expo's remote version map, so they can fail on an upstream
      # release with no change in this repository. They run last so that such a failure never
      # skips the build steps above and hide whether the code actually builds.
      - name: Expo dependency compatibility
        working-directory: apps/mobile
        run: pnpm exec expo install --check
      - name: Expo Doctor
        working-directory: apps/mobile
        run: pnpm dlx expo-doctor@1.20.1
